name: bettercode-release
run-name: BetterCode v${{ inputs.version }}

# Builds the bettercode command for every platform and the desktop app for macOS, Windows x64 and Linux x64, then
# publishes them with the installers (bettercode/install, bettercode/install.ps1) as the GitHub release v<version>.
# The builds are unsigned; the installers prepare them so they open without warnings.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.0.1)"
        required: true
        type: string
      announce:
        description: "Offer this release to the desktop apps' updater right away (otherwise publish it in Supabase later)"
        required: false
        type: boolean
        default: true

concurrency:
  group: bettercode-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OPENCODE_VERSION: ${{ inputs.version }}
  OPENCODE_CHANNEL: latest

jobs:
  build-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check version
        run: |
          [[ "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 0.0.1, got '$OPENCODE_VERSION'"; exit 1; }
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Fetch models catalog
        run: bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json
      - name: Build
        working-directory: packages/cli
        run: bun run build && rm -rf dist/.bun
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json
          GH_TOKEN: ${{ github.token }} # read-only; raises the rate limit for Bun release downloads
      - name: Archive
        run: |
          mkdir -p release
          for dir in packages/cli/dist/cli-*/; do
            target=$(basename "$dir")
            target=${target#cli-}
            stage=$(mktemp -d)
            if [[ $target == windows-* ]]; then
              cp "$dir/bin/opencode.exe" "$stage/bettercode.exe"
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/release/bettercode-$target.zip" bettercode.exe)
            else
              cp "$dir/bin/opencode" "$stage/bettercode"
              chmod 755 "$stage/bettercode"
              tar -czf "release/bettercode-$target.tar.gz" -C "$stage" bettercode
            fi
          done
          cp bettercode/install bettercode/install.ps1 release/
          ls -la release
      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf release/bettercode-linux-x64.tar.gz -C "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bettercode" --version
      - name: Upload CLI for the desktop builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-dist
          path: packages/cli/dist
          if-no-files-found: error
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli
          path: release
          if-no-files-found: error

  build-desktop:
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-packaged on the Intel runner: GitHub's macos-26 arm64 pool keeps dropping jobs for lack of capacity, and
          # macos-15 lacks the Xcode 26 the Icon Composer app icon needs. --cpu=* installs the build tools for this host
          # and the arm64 native modules for the app; packaging keeps only the arm64 ones and verifies every binary.
          - { target: darwin-arm64, host: macos-26-intel, install: --os=darwin --cpu=* }
          - { target: darwin-x64, host: macos-26-intel, install: --os=darwin --cpu=x64 }
          - { target: windows-x64, host: windows-2025, install: "" }
          - { target: linux-x64, host: ubuntu-24.04, install: "" }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Download CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-dist
          path: packages/cli/dist
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.install }}
      - name: Set up rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      # The update key goes into official builds only, so the update server offers updates to them alone.
      - name: Fetch update key
        env:
          BETTERCODE_PUBLISH_TOKEN: ${{ secrets.BETTERCODE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$BETTERCODE_PUBLISH_TOKEN" ]; then
            echo "::warning::BETTERCODE_PUBLISH_TOKEN is not set, so this build gets no updates."
            exit 0
          fi
          key=$(curl -fsS -X POST "https://anndpsqsihuohtmjisvx.supabase.co/functions/v1/update-key" \
            -H "x-publish-token: $BETTERCODE_PUBLISH_TOKEN" | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>process.stdout.write(JSON.parse(s).key))')
          echo "::add-mask::$key"
          echo "BETTERCODE_UPDATE_KEY=$key" >> "$GITHUB_ENV"
      - name: Build
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Pack
        working-directory: packages/desktop
        timeout-minutes: 60
        run: bun run pack
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
      # The first pack leaves the unpacked app; the second wraps it in the NSIS installer.
      - name: Pack Windows installer
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        timeout-minutes: 30
        run: |
          mv ../../dist/desktop/app "$RUNNER_TEMP/app"
          OPENCODE_DESKTOP_APP="$RUNNER_TEMP/app" bun run pack
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
      - name: Collect
        run: |
          mkdir -p release
          shopt -s nullglob
          case "${{ matrix.target }}" in
            darwin-*)
              cpu=${{ matrix.target }}
              cpu=${cpu#darwin-}
              gzip -c dist/desktop/opencode-desktop-mac-*.app.tar > "release/bettercode-desktop-darwin-$cpu.app.tar.gz"
              ;;
            windows-x64)
              cp dist/desktop/opencode-desktop-win-x64.exe release/bettercode-desktop-windows-x64-setup.exe
              ;;
            linux-x64)
              for file in dist/desktop/*.AppImage; do cp "$file" release/bettercode-desktop-linux-x64.AppImage; done
              for file in dist/desktop/*.deb; do cp "$file" release/bettercode-desktop-linux-x64.deb; done
              for file in dist/desktop/*.rpm; do cp "$file" release/bettercode-desktop-linux-x64.rpm; done
              ;;
          esac
          ls -la release
          [ -n "$(ls release)" ]
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-${{ matrix.target }}
          path: release
          if-no-files-found: error

  publish:
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: bettercode
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{version}}/$OPENCODE_VERSION/g; s#{{repository}}#$GITHUB_REPOSITORY#g" bettercode/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$OPENCODE_VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BetterCode $OPENCODE_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
      # Registers the desktop files with the update server (Supabase table `releases`, served on
      # bettercode.vercel.app). With announce off the rows are stored unpublished; set `published` in Supabase to offer
      # the update later.
      - name: Register update
        env:
          BETTERCODE_PUBLISH_TOKEN: ${{ secrets.BETTERCODE_PUBLISH_TOKEN }}
          ANNOUNCE: ${{ inputs.announce }}
        run: |
          if [ -z "$BETTERCODE_PUBLISH_TOKEN" ]; then
            echo "::warning::BETTERCODE_PUBLISH_TOKEN is not set, so desktop apps are not told about this release."
            exit 0
          fi
          node - <<'EOF' > "$RUNNER_TEMP/update.json"
          const { createHash } = require("node:crypto")
          const { readFileSync, statSync, existsSync } = require("node:fs")
          const kinds = [
            ["bettercode-desktop-windows-x64-setup.exe", "windows-x64", "installer"],
            ["bettercode-desktop-darwin-arm64.app.tar.gz", "darwin-arm64", "app"],
            ["bettercode-desktop-darwin-x64.app.tar.gz", "darwin-x64", "app"],
            ["bettercode-desktop-linux-x64.AppImage", "linux-x64", "appimage"],
            ["bettercode-desktop-linux-x64.deb", "linux-x64", "deb"],
            ["bettercode-desktop-linux-x64.rpm", "linux-x64", "rpm"],
          ]
          const files = kinds
            .filter(([name]) => existsSync(`release/${name}`))
            .map(([name, platform, kind]) => ({
              platform,
              kind,
              file_name: name,
              sha512: createHash("sha512").update(readFileSync(`release/${name}`)).digest("base64"),
              size: statSync(`release/${name}`).size,
            }))
          process.stdout.write(
            JSON.stringify({ version: process.env.OPENCODE_VERSION, published: process.env.ANNOUNCE !== "false", files }),
          )
          EOF
          curl -fsS -X POST "https://anndpsqsihuohtmjisvx.supabase.co/functions/v1/publish-release" \
            -H "x-publish-token: $BETTERCODE_PUBLISH_TOKEN" \
            -H "content-type: application/json" \
            --data-binary "@$RUNNER_TEMP/update.json"
